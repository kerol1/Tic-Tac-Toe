simulation:
  tick-delay: 0ms
  strategy: heuristic

engine:
  base-url: http://localhost:1
  read-timeout: 500ms
  retry-backoff: 10ms
  max-retries: 2

spring:
  http:
    client:
      # Apache HttpClient (pulled in by the Eureka starter) silently retries 503s in
      # TestRestTemplate, which would double-count engine attempts in the tests.
      factory: jdk

logging:
  level:
    com.tictactoe.session: INFO
    org.hibernate: WARN
