spring:
  application:
    name: game-session
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:sessions;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

server:
  port: ${SERVER_PORT:8082}

engine:
  base-url: ${ENGINE_BASE_URL:http://localhost:8081}
  connect-timeout: 2s
  read-timeout: 5s
  max-retries: 2
  retry-backoff: 200ms

simulation:
  tick-delay: ${SIMULATION_TICK_DELAY:600ms}
  strategy: ${SIMULATION_STRATEGY:heuristic}
  max-recovery-cycles: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [%X{requestId:-}] %logger{36} - %m%n"
