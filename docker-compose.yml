services:
  game-engine:
    build:
      context: .
      dockerfile: game-engine/Dockerfile
    environment:
      SERVER_PORT: "8081"
    # Internal service: deliberately no host port mapping
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  game-session:
    build:
      context: .
      dockerfile: game-session/Dockerfile
    environment:
      SERVER_PORT: "8082"
      ENGINE_BASE_URL: http://game-engine:8081
      SIMULATION_TICK_DELAY: ${SIMULATION_TICK_DELAY:-600ms}
    ports:
      - "8082:8082"
    depends_on:
      game-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: frontend
    ports:
      - "8080:80"
    depends_on:
      game-session:
        condition: service_healthy
