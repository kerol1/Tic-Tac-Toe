# Full topology: browser -> nginx (static UI, /api pass-through) -> gateway -> session -> engine,
# with every Spring service registered in Eureka. The engine and the gateway publish no host
# port on purpose; the only public doors are the UI (8080) and, for convenience, the session
# service (8082).
services:
  discovery:
    build:
      context: .
      dockerfile: discovery/Dockerfile
    environment:
      SERVER_PORT: "8761"
      EUREKA_HOSTNAME: discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  game-engine:
    build:
      context: .
      dockerfile: game-engine/Dockerfile
    environment:
      SERVER_PORT: "8081"
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://discovery:8761/eureka/
    # Internal service: deliberately no host port mapping
    depends_on:
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  game-session:
    build:
      context: .
      dockerfile: game-session/Dockerfile
    environment:
      SERVER_PORT: "8082"
      ENGINE_BASE_URL: http://game-engine
      ENGINE_DISCOVERY: "true"
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://discovery:8761/eureka/
      SIMULATION_TICK_DELAY: ${SIMULATION_TICK_DELAY:-600ms}
    ports:
      - "8082:8082"
    depends_on:
      game-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      SERVER_PORT: "8080"
      EUREKA_URL: http://discovery:8761/eureka/
    depends_on:
      game-session:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: frontend
    ports:
      - "8080:80"
    depends_on:
      gateway:
        condition: service_healthy
