server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Public API lives under /api; the session service serves bare paths, so the
    # trailing slash on proxy_pass strips the prefix.
    location /api/ {
        proxy_pass http://game-session:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-sent events must reach the browser as they happen.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
