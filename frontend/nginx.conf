server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to the shell.
    location / {
        try_files $uri /index.html;
    }

    # Docker's embedded DNS; re-resolving keeps working when the gateway container is
    # recreated with a new address instead of pinning the one seen at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Public API lives under /api. nginx passes the path through untouched (a variable
    # upstream never rewrites the URI) and the gateway is the one edge that strips the prefix.
    location /api/ {
        set $gateway http://gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-sent events must reach the browser as they happen.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
