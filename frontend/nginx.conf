server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to the shell.
    location / {
        try_files $uri /index.html;
    }

    # Public API lives under /api. nginx passes the path through untouched (no trailing
    # slash on proxy_pass) and the gateway is the one edge that strips the prefix.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-sent events must reach the browser as they happen.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
