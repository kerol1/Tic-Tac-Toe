spring:
  application:
    name: game-engine
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8081}

eureka:
  client:
    # Off by default: bare `mvn spring-boot:run` and the tests need no registry.
    # The compose file that ships the gateway turns it on.
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
    # Demo-sized cluster: register within seconds, not the default 40.
    initial-instance-info-replication-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [%X{requestId:-}] %logger{36} - %m%n"
